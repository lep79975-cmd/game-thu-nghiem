<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Online Chat - Công Khai Toàn Hệ Thống</title>
    <!-- Thư viện MQTT WebSocket để kết nối Server Realtime miễn phí -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --sidebar-bg: #12121a;
            --card-bg: #252536;
            --accent-color: #7289da;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* SIDEBAR (BÊN TRÁI) */
        #sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .user-panel {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #43b581;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #f04747; }
        .btn-primary { background: #7289da; }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room-item {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #7289da;
            transition: 0.2s;
        }

        .room-item:hover { 
            background: #32324a; 
            transform: translateX(3px);
        }

        /* KHUNG CHAT MÀN HÌNH CHÍNH */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* TIN NHẮN (BÊN PHẢI LA CỦA MÌNH, BÊN TRÁI LÀ NGƯỜI KHÁC) */
        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
            user-select: none;
            cursor: pointer;
        }

        .message.me {
            align-self: flex-end;
            background-color: #0084ff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            align-self: flex-start;
            background-color: var(--card-bg);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .msg-author {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
        }

        .typing-status {
            font-style: italic;
            color: #00f3ff;
            font-size: 0.9rem;
            height: 20px;
            padding-left: 20px;
            font-weight: bold;
        }

        /* NEON LINK (LINK CÓ GẠCH NGANG & HIỆU ỨNG NEON) */
        a.neon-link {
            color: #00f3ff;
            text-decoration: underline;
            text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
            font-weight: bold;
        }

        /* KHUNG NHẬP CHAT */
        .chat-input-area {
            padding: 15px;
            background: var(--sidebar-bg);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: white;
            outline: none;
        }

        .chat-media-preview img, .chat-media-preview video {
            max-width: 250px;
            border-radius: 8px;
            margin-top: 5px;
        }

        /* BẢNG QUYẾT ĐỊNH / KHẢO SÁT */
        .poll-box {
            background: #2f3136;
            border: 1px solid #7289da;
            border-radius: 8px;
            padding: 12px;
            margin-top: 5px;
            width: 100%;
        }

        .poll-option {
            background: #40444b;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .poll-option:hover { background: #575c66; }

        /* MODAL CỬA SỔ BẬT LÊN */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: white;
        }

        .status-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            background: #ff9800;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- CỘT BÊN TRÁI -->
    <div id="sidebar">
        <h3>Game Chat <span id="server-status" class="status-badge">Đang kết nối...</span></h3>
        
        <div class="user-panel">
            <span id="display-username">Đang tải...</span>
            <button class="btn btn-primary" onclick="changeName()" style="font-size:11px">Đổi tên</button>
        </div>

        <button class="btn" onclick="createRoom()">+ Tạo Phòng Mới</button>

        <div style="margin-top: 5px;">
            <label style="font-size: 12px;">Đổi màu nền Web:</label>
            <input type="color" id="bg-picker" onchange="changeBgColor(this.value)" value="#1a1a24" style="width: 100%; cursor: pointer;">
        </div>

        <h4 style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">Phòng Công Khai Online</h4>
        <div class="room-list" id="room-list">
            <!-- Tất cả các phòng tạo ra sẽ tự động hiện ở đây -->
        </div>
    </div>

    <!-- MÀN HÌNH CHAT CHÍNH -->
    <div id="chat-container">
        <div class="chat-header">
            <div>
                <h3 id="room-title">Chưa chọn phòng</h3>
                <small id="room-subtitle">Vui lòng chọn hoặc tạo phòng ở cột bên trái</small>
            </div>
            <div id="host-controls" style="display: none; gap: 8px;">
                <button class="btn btn-primary" onclick="openPollModal()">+ Bảng Quyết Định</button>
                <button class="btn btn-danger" onclick="openRoomInfo()">Thông tin phòng</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Tin nhắn hiển thị ở đây -->
        </div>

        <!-- Dấu ... xuất hiện khi có người đang gõ -->
        <div class="typing-status" id="typing-status"></div>

        <div class="chat-input-area">
            <input type="file" id="media-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
            <button class="btn btn-primary" onclick="document.getElementById('media-input').click()">📁 Media</button>
            <input type="text" id="message-input" placeholder="Nhập tin nhắn..." oninput="handleTyping()">
            <button class="btn" onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <!-- MODAL TẠO BẢNG QUYẾT ĐỊNH -->
    <div class="modal" id="poll-modal">
        <div class="modal-content">
            <h3>Tạo Bảng Quyết Định</h3>
            <input type="text" id="poll-question" placeholder="Ghi câu hỏi ở đây">
            <div id="poll-answers-container">
                <input type="text" class="poll-answer-input" placeholder="Ghi câu trả lời ở đây">
                <input type="text" class="poll-answer-input" placeholder="Ghi câu trả lời ở đây">
            </div>
            <button class="btn btn-primary" onclick="addPollOption()">Thêm câu trả lời +</button>
            <button class="btn" onclick="sendPoll()">Đăng Bảng Quyết Định</button>
            <button class="btn btn-danger" onclick="closeModal('poll-modal')">Hủy</button>
        </div>
    </div>

    <!-- MODAL THÔNG TIN PHÒNG & QUYỀN KICK -->
    <div class="modal" id="info-modal">
        <div class="modal-content">
            <h3>Thông tin phòng</h3>
            <div id="info-details"></div>
            <h4>Thành viên (Chủ phòng có quyền Kick):</h4>
            <div id="member-list"></div>
            <button class="btn btn-danger" onclick="closeModal('info-modal')">Đóng</button>
        </div>
    </div>

    <script>
        // TRẠNG THÁI & DỮ LIỆU CỤC BỘ
        let currentUser = localStorage.getItem('chat_username') || '';
        let currentRoomId = null;
        let isOwner = false;
        let selectedMedia = null;
        let typingTimeout = null;

        // DANH SÁCH PHÒNG CÔNG KHAI TOÀN MẠNG
        let publicRooms = {};

        // KẾT NỐI SERVER REALTIME CÔNG KHAI (MQTT SERVER)
        const BROKER = 'wss://broker.hivemq.com:8884/mqtt';
        const client = mqtt.connect(BROKER, {
            clientId: 'game_user_v4_' + Math.random().toString(16).substring(2, 10)
        });

        // Kênh thông tin công khai cho tất cả mọi người
        const TOPIC_GLOBAL = 'game_online_chat_v4/public_global_rooms';

        client.on('connect', () => {
            document.getElementById('server-status').innerText = 'Online';
            document.getElementById('server-status').style.background = '#43b581';
            
            // Đăng ký nhận thông tin từ kênh chung công khai
            client.subscribe(TOPIC_GLOBAL);
            
            // Yêu cầu tất cả các máy đang online đồng bộ danh sách phòng
            client.publish(TOPIC_GLOBAL, JSON.stringify({ type: 'REQUEST_SYNC' }));
        });

        client.on('message', (topic, payload) => {
            try {
                const data = JSON.parse(payload.toString());

                // 1. ĐỒNG BỘ DANH SÁCH PHÒNG CÔNG KHAI
                if (topic === TOPIC_GLOBAL) {
                    if (data.type === 'NEW_ROOM' || data.type === 'UPDATE_ROOM') {
                        publicRooms[data.room.id] = data.room;
                        renderRoomList();
                    } else if (data.type === 'SYNC_ALL') {
                        publicRooms = { ...publicRooms, ...data.rooms };
                        renderRoomList();
                    } else if (data.type === 'REQUEST_SYNC') {
                        // Phát lại danh sách phòng hiện có cho người mới mở trang web
                        if (Object.keys(publicRooms).length > 0) {
                            client.publish(TOPIC_GLOBAL, JSON.stringify({
                                type: 'SYNC_ALL',
                                rooms: publicRooms
                            }));
                        }
                    }
                } 
                // 2. LẮNG NGHE CHAT TRONG PHÒNG HIỆN TẠI
                else if (currentRoomId && topic === `game_online_chat_v4/room/${currentRoomId}`) {
                    if (data.type === 'MESSAGE') {
                        const room = publicRooms[currentRoomId];
                        if (room && !room.messages.some(m => m.id === data.msg.id)) {
                            room.messages.push(data.msg);
                            renderMessages();
                        }
                    } else if (data.type === 'TYPING') {
                        if (data.user !== currentUser) {
                            const statusEl = document.getElementById('typing-status');
                            statusEl.innerText = data.isTyping ? `${data.user} đang nhắn ...` : '';
                        }
                    } else if (data.type === 'KICK') {
                        if (data.targetUser === currentUser) {
                            alert("Bạn đã bị chủ phòng KICK!");
                            location.reload();
                        }
                    } else if (data.type === 'DELETE_MSG') {
                        const room = publicRooms[currentRoomId];
                        if (room) {
                            room.messages = room.messages.filter(m => m.id !== data.msgId);
                            renderMessages();
                        }
                    }
                }
            } catch(e) { console.error(e); }
        });

        // QUẢN LÝ TÊN & MÀU NỀN
        window.onload = () => {
            if (!currentUser) {
                changeName();
            } else {
                document.getElementById('display-username').innerText = currentUser;
            }
            applySavedBg();
        };

        function changeName() {
            let name = prompt("Nhập tên hiển thị của bạn:", currentUser);
            if (name && name.trim() !== '') {
                currentUser = name.trim();
                localStorage.setItem('chat_username', currentUser);
                document.getElementById('display-username').innerText = currentUser;
            }
        }

        function changeBgColor(color) {
            document.body.style.backgroundColor = color;
            localStorage.setItem('chat_bg_color', color);
        }

        function applySavedBg() {
            const color = localStorage.getItem('chat_bg_color');
            if (color) {
                document.body.style.backgroundColor = color;
                document.getElementById('bg-picker').value = color;
            }
        }

        // TẠO PHÒNG & CÔNG KHAI TOÀN MẠNG
        function createRoom() {
            const roomName = prompt("Nhập tên phòng muốn tạo:");
            if (!roomName) return;

            const newRoom = {
                id: 'room_' + Date.now(),
                name: roomName,
                host: currentUser,
                createdAt: new Date().toLocaleString(),
                messages: [],
                members: [currentUser]
            };

            publicRooms[newRoom.id] = newRoom;
            
            // Phát sóng cho tất cả trang web trên thế giới biết có phòng mới
            client.publish(TOPIC_GLOBAL, JSON.stringify({
                type: 'NEW_ROOM',
                room: newRoom
            }));

            // Vào phòng ngay lập tức
            joinRoom(newRoom.id);
        }

        function renderRoomList() {
            const roomListEl = document.getElementById('room-list');
            roomListEl.innerHTML = '';

            const roomKeys = Object.keys(publicRooms);
            if (roomKeys.length === 0) {
                roomListEl.innerHTML = '<small style="color:#aaa; padding: 10px;">Chưa có phòng nào. Hãy ấn "+ Tạo Phòng Mới"!</small>';
                return;
            }

            roomKeys.forEach(key => {
                const room = publicRooms[key];
                const item = document.createElement('div');
                item.className = 'room-item';
                item.innerHTML = `
                    <div>
                        <strong>${room.name}</strong><br>
                        <small style="color:#aaa">Chủ: ${room.host}</small>
                    </div>
                    <small style="color:#43b581">Online</small>
                `;
                item.onclick = () => joinRoom(room.id);
                roomListEl.appendChild(item);
            });
        }

        function joinRoom(roomId) {
            if (currentRoomId) {
                client.unsubscribe(`game_online_chat_v4/room/${currentRoomId}`);
            }

            const room = publicRooms[roomId];
            if (!room) return;

            currentRoomId = roomId;
            isOwner = room.host === currentUser;

            // Đăng ký nghe tin nhắn của phòng được chọn
            client.subscribe(`game_online_chat_v4/room/${currentRoomId}`);

            document.getElementById('room-title').innerText = room.name;
            document.getElementById('room-subtitle').innerText = `Chủ phòng: ${room.host}`;
            document.getElementById('host-controls').style.display = isOwner ? 'flex' : 'none';

            renderMessages();
        }

        // TỰ ĐỘNG PHÁT HIỆN GÕ PHÍM "..."
        function handleTyping() {
            const input = document.getElementById('message-input');
            if (input.value.length > 0 && currentRoomId) {
                client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                    type: 'TYPING',
                    user: currentUser,
                    isTyping: true
                }));

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                        type: 'TYPING',
                        user: currentUser,
                        isTyping: false
                    }));
                }, 1500);
            }
        }

        // XỬ LÝ MEDIA & ĐƯỜNG LINK NEON
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedMedia = {
                    type: file.type.startsWith('image/') ? 'image' : 'video',
                    url: evt.target.result
                };
                sendMessage();
            };
            reader.readAsDataURL(file);
        }

        function formatMessageText(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a class="neon-link" href="${url}" target="_blank">${url}</a>`;
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text && !selectedMedia) return;
            if (!currentRoomId) {
                alert("Vui lòng chọn 1 phòng ở cột bên trái trước!");
                return;
            }

            const newMessage = {
                id: 'msg_' + Date.now(),
                sender: currentUser,
                text: text,
                media: selectedMedia,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            // Gửi tin nhắn qua Server Realtime
            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'MESSAGE',
                msg: newMessage
            }));

            input.value = '';
            selectedMedia = null;
            document.getElementById('media-input').value = '';
            
            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'TYPING', user: currentUser, isTyping: false
            }));
        }

        // HIỂN THỊ TIN NHẮN (Bên phải: Mình, Bên trái: Người khác)
        function renderMessages() {
            if (!currentRoomId || !publicRooms[currentRoomId]) return;
            const room = publicRooms[currentRoomId];
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';

            room.messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isMe ? 'me' : 'other'}`;

                let contentHtml = `<span class="msg-author">${msg.sender} [${msg.timestamp}]</span>`;
                
                if (msg.text) {
                    contentHtml += `<div>${formatMessageText(msg.text)}</div>`;
                }

                if (msg.media) {
                    if (msg.media.type === 'image') {
                        contentHtml += `<div class="chat-media-preview"><img src="${msg.media.url}"></div>`;
                    } else if (msg.media.type === 'video') {
                        contentHtml += `<div class="chat-media-preview"><video src="${msg.media.url}" controls></video></div>`;
                    }
                }

                if (msg.poll) {
                    contentHtml += `
                        <div class="poll-box">
                            <strong>📊 ${msg.poll.question}</strong>
                            ${msg.poll.options.map((opt, idx) => `
                                <div class="poll-option" onclick="votePoll('${msg.id}', ${idx})">
                                    ${opt.text} (${opt.votes ? opt.votes.length : 0})
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                msgEl.innerHTML = contentHtml;

                // XÓA TIN NHẮN BẰNG CÁCH GIỮ NÚT (LONG PRESS)
                let pressTimer;
                msgEl.addEventListener('mousedown', () => {
                    pressTimer = window.setTimeout(() => {
                        if (confirm("Bạn có muốn xóa tin nhắn này không?")) {
                            deleteMessage(msg.id);
                        }
                    }, 800);
                });
                msgEl.addEventListener('mouseup', () => clearTimeout(pressTimer));
                msgEl.addEventListener('mouseleave', () => clearTimeout(pressTimer));

                chatBox.appendChild(msgEl);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function deleteMessage(msgId) {
            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'DELETE_MSG',
                msgId: msgId
            }));
        }

        // BẢNG QUYẾT ĐỊNH / KHẢO SÁT
        function openPollModal() { document.getElementById('poll-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addPollOption() {
            const container = document.getElementById('poll-answers-container');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'poll-answer-input';
            input.placeholder = 'Ghi câu trả lời ở đây';
            container.appendChild(input);
        }

        function sendPoll() {
            const q = document.getElementById('poll-question').value.trim();
            const optionInputs = document.querySelectorAll('.poll-answer-input');
            const options = [];

            optionInputs.forEach(input => {
                if (input.value.trim()) {
                    options.push({ text: input.value.trim(), votes: [] });
                }
            });

            if (!q || options.length < 2) {
                alert("Vui lòng nhập câu hỏi và ít nhất 2 câu trả lời!");
                return;
            }

            const pollMsg = {
                id: 'msg_' + Date.now(),
                sender: currentUser,
                poll: { question: q, options: options },
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'MESSAGE',
                msg: pollMsg
            }));

            closeModal('poll-modal');
        }

        function votePoll(msgId, optionIndex) {
            const room = publicRooms[currentRoomId];
            const msg = room.messages.find(m => m.id === msgId);
            if (!msg || !msg.poll) return;

            msg.poll.options.forEach(opt => {
                opt.votes = (opt.votes || []).filter(u => u !== currentUser);
            });

            msg.poll.options[optionIndex].votes.push(currentUser);

            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'MESSAGE',
                msg: msg
            }));
        }

        // THÔNG TIN PHÒNG & KICK
        function openRoomInfo() {
            const room = publicRooms[currentRoomId];
            if (!room) return;

            document.getElementById('info-details').innerHTML = `
                <p><strong>Thời gian tạo:</strong> ${room.createdAt}</p>
                <p><strong>Tổng số tin nhắn:</strong> ${room.messages.length}</p>
            `;

            const memberList = document.getElementById('member-list');
            memberList.innerHTML = '';
            
            const activeUsers = Array.from(new Set(room.messages.map(m => m.sender).concat([room.host])));

            activeUsers.forEach(m => {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justifyContent = 'space-between';
                div.style.marginTop = '5px';
                div.innerHTML = `<span>${m} ${m === room.host ? '👑 (Chủ phòng)' : ''}</span>`;
                
                if (isOwner && m !== currentUser) {
                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'btn btn-danger';
                    kickBtn.innerText = 'Kick';
                    kickBtn.style.padding = '2px 8px';
                    kickBtn.onclick = () => kickMember(m);
                    div.appendChild(kickBtn);
                }
                memberList.appendChild(div);
            });

            document.getElementById('info-modal').style.display = 'flex';
        }

        function kickMember(member) {
            client.publish(`game_online_chat_v4/room/${currentRoomId}`, JSON.stringify({
                type: 'KICK',
                targetUser: member
            }));
            closeModal('info-modal');
        }
    </script>
</body>
</html>
