<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tower Defense Survival - Roblox Style</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0814; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* LOBBY OVERLAY */
        #lobby-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 8, 20, 0.96); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); }
        .lobby-card { background: #16122c; border: 1px solid #3d3266; border-radius: 20px; padding: 24px; width: 90%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 14px; }
        .lobby-title { font-size: 22px; font-weight: 800; text-align: center; color: #ff9f43; letter-spacing: 1px; }
        
        input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3d3266; background: #0d0a1a; color: #fff; font-size: 14px; outline: none; user-select: text; }
        input[type="text"]:focus { border-color: #ff9f43; }

        .btn { background: #ff9f43; color: #000; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn:hover { background: #ffb164; }
        .btn-purple { background: #54a0ff; color: #fff; }
        .btn-danger { background: #ee5253; color: #fff; }
        .btn-green { background: #2ed573; color: #fff; }

        /* GAME UI CONTAINER */
        #game-ui { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 800px; height: 100vh; justify-content: space-between; padding: 10px; }
        
        #top-hud { width: 100%; background: #16122c; border: 1px solid #3d3266; border-radius: 12px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
        .hud-stat { color: #ff9f43; }

        #canvas-wrapper { position: relative; width: 100%; height: 65vh; max-height: 500px; border-radius: 16px; overflow: hidden; border: 2px solid #3d3266; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #07050f; }
        canvas { width: 100%; height: 100%; display: block; }

        /* VIRTUAL JOYSTICK (ROBLOX STYLE) */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.15); border-radius: 50%; touch-action: none; z-index: 10; display: flex; align-items: center; justify-content: center; }
        #joystick-knob { width: 50px; height: 50px; background: rgba(255,159,67,0.7); border-radius: 50%; position: absolute; pointer-events: none; transition: transform 0.05s linear; }

        /* BUILD MENU MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .modal-card { background: #16122c; border: 1px solid #54a0ff; border-radius: 16px; padding: 20px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
        .build-item { background: #0d0a1a; border: 1px solid #3d3266; border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* CHAT / NOTIFICATION SÀNH */
        #bottom-chat { width: 100%; background: #16122c; border: 1px solid #3d3266; border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
        #chat-input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #3d3266; background: #0d0a1a; color: #fff; font-size: 12px; }
    </style>
</head>
<body>

    <!-- LOBBY & NAME SETUP -->
    <div id="lobby-overlay">
        <div class="lobby-card">
            <div class="lobby-title">🏰 TOWER DEFENSE SURVIVAL</div>
            <div style="font-size: 12px; color: #aaa; text-align: center;">Nhập tên của bạn để bắt đầu vào sảnh chờ</div>
            <input type="text" id="username-input" placeholder="Tên người chơi..." maxlength="15">
            <button class="btn" onclick="joinLobby()">Vào Sảnh Chờ</button>
            <div id="lobby-status" style="font-size: 12px; color: #ff9f43; text-align: center; margin-top: 5px;">Trạng thái: Sẵn sàng</div>
        </div>
    </div>

    <!-- GAMEPLAY UI -->
    <div id="game-ui">
        <div id="top-hud">
            <div>💰 Vàng: <span id="hud-gold" class="hud-stat">0$</span></div>
            <div>🏠 Nhà: <span id="hud-house" class="hud-stat">Chưa có</span></div>
            <div>⚡ Trạng thái: <span id="hud-status" class="hud-stat">Đang tìm phòng...</span></div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <div id="bottom-chat">
            <input type="text" id="game-chat-input" placeholder="Nhập chat..." maxlength="50">
            <button class="btn btn-purple" style="padding: 8px 14px; font-size: 12px;" onclick="sendGameChat()">Gửi</button>
        </div>
    </div>

    <!-- BUILD MENU MODAL -->
    <div id="build-modal" class="modal">
        <div class="modal-card">
            <h3 style="color: #ff9f43; font-size: 16px; text-align: center;">🛠️ Menu Xây Dựng</h3>
            <div class="build-item">
                <div>
                    <strong style="color: #54a0ff; font-size: 13px;">Súng Tự Động</strong>
                    <div style="font-size: 10px; color: #aaa;" id="gun-stat-desc">Dame: 5 | Tầm: 10 | Máu: 20</div>
                </div>
                <button class="btn btn-green" style="padding: 6px 12px; font-size: 11px;" onclick="buildStructure('GUN')">Mua <span id="gun-price">10$</span></button>
            </div>
            <div class="build-item">
                <div>
                    <strong style="color: #2ed573; font-size: 13px;">Hộp Bảo Mật</strong>
                    <div style="font-size: 10px; color: #aaa;">+5$ thu nhập giường/s</div>
                </div>
                <button class="btn btn-green" style="padding: 6px 12px; font-size: 11px;" onclick="buildStructure('BOX')">Mua 45$</button>
            </div>
            <button class="btn btn-danger" style="padding: 8px; font-size: 12px;" onclick="closeBuildModal()">Đóng</button>
        </div>
    </div>

    <!-- REQUEST TO ENTER HOUSE MODAL -->
    <div id="request-modal" class="modal">
        <div class="modal-card" style="text-align: center;">
            <h3 style="color: #54a0ff; font-size: 16px;">🚪 Yêu Cầu Vào Nhà</h3>
            <p id="request-text" style="font-size: 13px; color: #fff;">Người chơi X muốn vào nhà chung của bạn!</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-danger" style="flex: 1;" onclick="responseEnterHouse(false)">Từ Chối</button>
                <button class="btn btn-green" style="flex: 1;" onclick="responseEnterHouse(true)">Đồng Ý</button>
            </div>
        </div>
    </div>

    <script>
        const MQTT_TOPIC = "td-survival-v1/global-room";
        const myClientId = 'user_' + Math.random().toString(36).substr(2, 8);
        let myName = "Người Chơi";
        let client = null;

        let myGold = 100;
        let myPos = { x: 400, y: 300 };
        let velocity = { x: 0, y: 0 };
        let isInsideHouse = false;
        let currentHouseId = null;
        let isHouseOwner = false;

        let bedLevel = 0;
        let bedIncome = 1;
        let bedPrices = [50, 250, 500, 2350];
        let bedIncomes = [5, 25, 45, 50];

        let gunPrice = 10;
        let gunLevel = 1;
        let gunStats = { dmg: 5, range: 10, hp: 20 };

        let selectedGridIndex = null;
        let structures = {}; // Grid index -> type
        let securityBoxesCount = 0;

        let gameStarted = false;
        let isMonster = false;
        let monsterHP = 100;
        let monsterEXP = 0;
        let monsterLevel = 1;
        let monsterDMG = 10;

        let doors = { 1: { hp: 50, maxHp: 50, repairCD: 0 } };
        let playersInRoom = {};
        let activeRoomId = "ROOM_1";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('td_username');
            if (saved) document.getElementById('username-input').value = saved;
        });

        function joinLobby() {
            const val = document.getElementById('username-input').value.trim();
            if (!val) return alert("Vui lòng nhập tên!");
            myName = val;
            localStorage.setItem('td_username', myName);

            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            initMQTT();
            initJoystick();
            initCanvas();
            startGameLoop();

            setInterval(incomeLoop, 1000);
        }

        function initMQTT() {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: myClientId });
            client.on('connect', () => {
                client.subscribe(MQTT_TOPIC);
                client.subscribe(`${MQTT_TOPIC}/${myClientId}`);
                broadcastPresence();
            });
            client.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (topic === `${MQTT_TOPIC}/${myClientId}`) {
                        if (data.type === 'REQUEST_ENTER') {
                            showRequestModal(data.requesterId, data.requesterName);
                        } else if (data.type === 'RESPONSE_ENTER') {
                            if (data.accepted) {
                                isInsideHouse = true;
                                alert("Đã được chủ nhà đồng ý cho vào!");
                            } else {
                                alert("Chủ nhà đã từ chối!");
                            }
                        }
                        return;
                    }

                    if (data.sender === myClientId) return;
                    if (data.type === 'SYNC_PLAYER') {
                        playersInRoom[data.sender] = data;
                        checkGameStart();
                    }
                } catch(e){}
            });
        }

        function broadcastPresence() {
            if (!client || !client.connected) return;
            client.publish(MQTT_TOPIC, JSON.stringify({
                type: 'SYNC_PLAYER',
                sender: myClientId,
                name: myName,
                x: myPos.x,
                y: myPos.y,
                isMonster: isMonster
            }));
        }

        function checkGameStart() {
            let count = Object.keys(playersInRoom).length + 1;
            document.getElementById('hud-status').innerText = `Sảnh: ${count} người chơi`;
            if (!gameStarted && count >= 3) {
                gameStarted = true;
                document.getElementById('hud-status').innerText = "Trò chơi bắt đầu sau 10s!";
                setTimeout(() => {
                    document.getElementById('hud-status').innerText = "Đang sinh tồn!";
                }, 10000);
            }
        }

        function initCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            myPos.x = canvas.width / 2;
            myPos.y = canvas.height / 2;
        }

        /* VIRTUAL JOYSTICK */
        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let active = false;
            let origin = { x: 0, y: 0 };

            zone.addEventListener('pointerdown', (e) => {
                active = true;
                const rect = zone.getBoundingClientRect();
                origin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            window.addEventListener('pointermove', (e) => {
                if (!active) return;
                let dx = e.clientX - origin.x;
                let dy = e.clientY - origin.y;
                let dist = Math.hypot(dx, dy);
                let maxDist = 40;
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                velocity.x = (dx / maxDist) * 3;
                velocity.y = (dy / maxDist) * 3;
            });

            window.addEventListener('pointerup', () => {
                if (!active) return;
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                velocity.x = 0;
                velocity.y = 0;
            });
        }

        function startGameLoop() {
            function loop() {
                myPos.x += velocity.x;
                myPos.y += velocity.y;
                myPos.x = Math.max(20, Math.min(canvas.width - 20, myPos.x));
                myPos.y = Math.max(20, Math.min(canvas.height - 20, myPos.y));

                broadcastPresence();

                // Render Canvas Map
                ctx.fillStyle = '#07050f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw House
                let houseX = canvas.width / 2 - 100;
                let houseY = canvas.height / 2 - 100;
                ctx.fillStyle = '#1c1638';
                ctx.fillRect(houseX, houseY, 200, 200);
                ctx.strokeStyle = '#54a0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(houseX, houseY, 200, 200);

                // Draw Door
                ctx.fillStyle = '#ff9f43';
                ctx.fillRect(houseX + 75, houseY + 185, 50, 15);

                // Draw Bed inside house if owner
                ctx.fillStyle = '#2ed573';
                ctx.fillRect(houseX + 20, houseY + 20, 40, 30);

                // Draw Player
                ctx.fillStyle = isMonster ? '#ee5253' : '#54a0ff';
                ctx.beginPath();
                ctx.arc(myPos.x, myPos.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                document.getElementById('hud-gold').innerText = myGold + "$";
                document.getElementById('hud-house').innerText = isInsideHouse ? "Đã vào nhà" : "Ngoài trời";

                requestAnimationFrame(loop);
            }
            loop();
        }

        function incomeLoop() {
            if (isInsideHouse) {
                let totalIncome = bedIncome + (securityBoxesCount * 5);
                myGold += totalIncome;
            }
        }

        function sendGameChat() {
            const input = document.getElementById('game-chat-input');
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX - rect.left;
            let cy = e.clientY - rect.top;

            // Check if clicking house door to enter
            let houseX = canvas.width / 2 - 100;
            let houseY = canvas.height / 2 - 100;
            if (cx >= houseX + 75 && cx <= houseX + 125 && cy >= houseY + 185 && cy <= houseY + 200) {
                if (!isInsideHouse) {
                    // Send request to enter house owner
                    alert("Đã gửi yêu cầu vào nhà!");
                }
            }

            // If inside house, click grid plus signs to build
            if (isInsideHouse && cx >= houseX + 20 && cx <= houseX + 180 && cy >= houseY + 70 && cy <= houseY + 180) {
                selectedGridIndex = Math.floor((cx - (houseX + 20)) / 40);
                document.getElementById('build-modal').style.display = 'flex';
            }
        });

        function closeBuildModal() {
            document.getElementById('build-modal').style.display = 'none';
        }

        function buildStructure(type) {
            if (type === 'GUN') {
                if (myGold < gunPrice) return alert("Không đủ vàng!");
                myGold -= gunPrice;
                structures[selectedGridIndex] = 'GUN';
                gunPrice = Math.round(gunPrice * 1.3);
                document.getElementById('gun-price').innerText = gunPrice + "$";
            } else if (type === 'BOX') {
                if (myGold < 45) return alert("Không đủ vàng!");
                myGold -= 45;
                securityBoxesCount++;
            }
            closeBuildModal();
        }

        let pendingRequesterId = null;
        function showRequestModal(id, name) {
            pendingRequesterId = id;
            document.getElementById('request-text').innerText = `Người chơi ${name} muốn vào nhà chung của bạn!`;
            document.getElementById('request-modal').style.display = 'flex';
        }

        function responseEnterHouse(accepted) {
            document.getElementById('request-modal').style.display = 'none';
            if (client && client.connected) {
                client.publish(`${MQTT_TOPIC}/${pendingRequesterId}`, JSON.stringify({
                    type: 'RESPONSE_ENTER',
                    accepted: accepted
                }));
            }
        }
    </script>
</body>
</html>
