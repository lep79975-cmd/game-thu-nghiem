<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Online - Đăng Video & Bình Luận</title>
    <!-- Thư viện MQTT WebSocket kết nối Online Realtime -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #fe2c55;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* KHUNG TIKTOK PHONG CÁCH MÀN HÌNH DỌC */
        #tiktok-app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* HEADER THANH CÔNG CỤ */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .user-info {
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.03); }
        .btn-secondary { background: rgba(255,255,255,0.2); }

        /* DANH SÁCH VIDEO SCROLL SNAP */
        .feed-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .feed-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        /* THẺ VIDEO TIKTOK */
        .video-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* THÔNG TIN VIDEO (BÊN DƯỚI) */
        .video-details {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            z-index: 5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .video-author {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            color: #fff;
        }

        .video-caption {
            font-size: 14px;
            line-height: 1.3;
            color: #ddd;
        }

        /* CỘT TÁC VỤ BÊN PHẢI (TIM, BÌNH LUẬN) */
        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 40px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 12px;
        }

        .action-icon {
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-bottom: 4px;
            transition: transform 0.2s;
        }

        .action-btn:active .action-icon {
            transform: scale(1.2);
        }

        .action-icon.liked {
            color: var(--accent-color);
        }

        /* MÀN HÌNH BÌNH LUẬN (SLIDE-UP MODAL) */
        .comment-drawer {
            position: absolute;
            bottom: -100%;
            left: 0;
            right: 0;
            height: 60%;
            background: #181818;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 20;
            transition: bottom 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .comment-drawer.open {
            bottom: 0;
        }

        .comment-header {
            padding: 12px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
        }

        .close-comment {
            position: absolute;
            right: 15px;
            top: 10px;
            cursor: pointer;
            font-size: 18px;
            color: #888;
        }

        .comment-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            font-size: 13px;
        }

        .comment-user {
            font-weight: bold;
            color: #aaa;
            margin-bottom: 2px;
        }

        .comment-text {
            color: #fff;
            word-break: break-word;
        }

        .comment-time {
            font-size: 10px;
            color: #666;
            margin-left: 6px;
        }

        .comment-input-area {
            padding: 10px 15px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            background: #111;
        }

        .comment-input-area input {
            flex: 1;
            background: #252525;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            color: white;
            outline: none;
            font-size: 13px;
        }

        /* MODAL ĐĂNG VIDEO */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content input[type="text"], .modal-content textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            outline: none;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #25d366;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="tiktok-app">
        <!-- HEADER TRÊN CÙNG -->
        <div class="header">
            <div class="user-info">
                <span id="display-user">Đang tải...</span>
                <span id="server-status" class="status-badge">Online</span>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="btn btn-secondary" onclick="changeName()">Đổi tên</button>
                <button class="btn" onclick="openUploadModal()">+ Đăng Video</button>
            </div>
        </div>

        <!-- BẢNG TIN VIDEO (FEED) -->
        <div class="feed-container" id="feed-container">
            <!-- Các Video sẽ được tự động vẽ ra ở đây -->
        </div>

        <!-- CỬA SỔ BÌNH LUẬN (SLIDE-UP) -->
        <div class="comment-drawer" id="comment-drawer">
            <div class="comment-header">
                <span id="comment-count-title">Bình luận</span>
                <span class="close-comment" onclick="closeComments()">✕</span>
            </div>
            <div class="comment-list" id="comment-list">
                <!-- Danh sách bình luận -->
            </div>
            <div class="comment-input-area">
                <input type="text" id="comment-input" placeholder="Thêm bình luận..." onkeypress="if(event.key==='Enter') submitComment()">
                <button class="btn" onclick="submitComment()">Đăng</button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐĂNG VIDEO MỚI -->
    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <h3 style="text-align: center;">Đăng Video Mới</h3>
            <label style="font-size: 12px; color: #aaa;">Chọn video từ thiết bị:</label>
            <input type="file" id="video-file-input" accept="video/*">
            
            <textarea id="video-caption-input" rows="3" placeholder="Viết mô tả cho video của bạn..."></textarea>
            
            <button class="btn" onclick="uploadVideo()">Đăng ngay</button>
            <button class="btn btn-secondary" onclick="closeUploadModal()">Hủy</button>
        </div>
    </div>

    <script>
        // DỮ LIỆU TÀI KHOẢN VÀ BÀI ĐĂNG
        let currentUser = localStorage.getItem('tiktok_username') || '';
        let posts = JSON.parse(localStorage.getItem('tiktok_posts') || '[]');
        let activePostIdForComment = null;

        // KẾT NỐI SERVER ONLINE REALTIME
        const BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const client = mqtt.connect(BROKER, {
            clientId: 'tiktok_user_' + Math.random().toString(16).substring(2, 10),
            keepalive: 60
        });

        const TOPIC_GLOBAL = 'tiktok_app_v7/global_feed';

        client.on('connect', () => {
            document.getElementById('server-status').innerText = 'Online';
            client.subscribe(TOPIC_GLOBAL);
            // Đồng bộ dữ liệu video từ những người dùng khác
            client.publish(TOPIC_GLOBAL, JSON.stringify({ type: 'REQ_SYNC' }));
        });

        client.on('message', (topic, payload) => {
            try {
                const data = JSON.parse(payload.toString());

                if (data.type === 'NEW_POST') {
                    if (!posts.some(p => p.id === data.post.id)) {
                        posts.unshift(data.post);
                        saveAndRender();
                    }
                } else if (data.type === 'TOGGLE_LIKE') {
                    const post = posts.find(p => p.id === data.postId);
                    if (post) {
                        post.likes = data.likes;
                        saveAndRender(false);
                    }
                } else if (data.type === 'ADD_COMMENT') {
                    const post = posts.find(p => p.id === data.postId);
                    if (post) {
                        post.comments.push(data.comment);
                        saveAndRender(false);
                        if (activePostIdForComment === data.postId) {
                            renderComments();
                        }
                    }
                } else if (data.type === 'REQ_SYNC') {
                    // Gửi toàn bộ danh sách bài đăng hiện có cho người mới vào
                    posts.forEach(p => {
                        client.publish(TOPIC_GLOBAL, JSON.stringify({ type: 'NEW_POST', post: p }));
                    });
                }
            } catch(e) { console.error(e); }
        });

        // KHỞI TẠO BAN ĐẦU
        window.onload = () => {
            if (!currentUser) {
                changeName();
            } else {
                document.getElementById('display-user').innerText = '@' + currentUser;
            }

            // Nếu chưa có video nào, tạo video mẫu ban đầu
            if (posts.length === 0) {
                posts = [
                    {
                        id: 'post_demo_1',
                        author: 'GamingPro',
                        caption: 'Pha xử lý thần thánh hôm nay nè mọi người! 🎮🔥',
                        videoUrl: 'https://assets.mixkit.co/videos/preview/mixkit-game-animation-of-a-robot-character-42964-large.mp4',
                        likes: ['GamingPro'],
                        comments: [
                            { id: 'c1', user: 'NamGame', text: 'Đỉnh quá bạn ơi!', timestamp: '12:00' }
                        ]
                    }
                ];
                saveToStorage();
            }

            renderFeed();
        };

        function changeName() {
            let name = prompt("Nhập tên người dùng TikTok của bạn:", currentUser);
            if (name && name.trim() !== '') {
                currentUser = name.trim().replace(/\s+/g, '_');
                localStorage.setItem('tiktok_username', currentUser);
                document.getElementById('display-user').innerText = '@' + currentUser;
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem('tiktok_posts', JSON.stringify(posts));
            } catch(e) {
                console.warn("Bộ nhớ trình duyệt đầy:", e);
            }
        }

        function saveAndRender(fullReRender = true) {
            saveToStorage();
            if (fullReRender) renderFeed();
        }

        // VẼ DỰ LIỆU FEED VIDEO
        function renderFeed() {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            posts.forEach(post => {
                const isLiked = post.likes.includes(currentUser);
                const card = document.createElement('div');
                card.className = 'video-card';
                
                card.innerHTML = `
                    <video src="${post.videoUrl}" loop playsinline onclick="togglePlay(this)"></video>

                    <div class="video-details">
                        <div class="video-author">@${post.author}</div>
                        <div class="video-caption">${escapeHtml(post.caption)}</div>
                    </div>

                    <div class="side-actions">
                        <button class="action-btn" onclick="toggleLike('${post.id}')">
                            <div class="action-icon ${isLiked ? 'liked' : ''}">
                                ${isLiked ? '❤️' : '🤍'}
                            </div>
                            <span>${post.likes.length}</span>
                        </button>

                        <button class="action-btn" onclick="openComments('${post.id}')">
                            <div class="action-icon">💬</div>
                            <span>${post.comments.length}</span>
                        </button>
                    </div>
                `;

                feedContainer.appendChild(card);
            });

            // Tự động phát video khi lướt tới
            setupIntersectionObserver();
        }

        function togglePlay(videoEl) {
            if (videoEl.paused) {
                videoEl.play();
            } else {
                videoEl.pause();
            }
        }

        // TỰ ĐỘNG PHÁT/DỪNG VIDEO KHI SCROLL
        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch(() => {});
                        } else {
                            video.pause();
                        }
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
        }

        // THẢ TIM (LIKE)
        function toggleLike(postId) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const index = post.likes.indexOf(currentUser);
            if (index === -1) {
                post.likes.push(currentUser);
            } else {
                post.likes.splice(index, 1);
            }

            saveToStorage();
            renderFeed();

            client.publish(TOPIC_GLOBAL, JSON.stringify({
                type: 'TOGGLE_LIKE',
                postId: postId,
                likes: post.likes
            }));
        }

        // MỞ VÀ ĐĂNG BÌNH LUẬN (BAO GỒM CẢ VIDEO CỦA CHÍNH MÌNH)
        function openComments(postId) {
            activePostIdForComment = postId;
            renderComments();
            document.getElementById('comment-drawer').classList.add('open');
        }

        function closeComments() {
            document.getElementById('comment-drawer').classList.remove('open');
            activePostIdForComment = null;
        }

        function renderComments() {
            if (!activePostIdForComment) return;
            const post = posts.find(p => p.id === activePostIdForComment);
            if (!post) return;

            document.getElementById('comment-count-title').innerText = `${post.comments.length} bình luận`;
            const commentList = document.getElementById('comment-list');
            commentList.innerHTML = '';

            if (post.comments.length === 0) {
                commentList.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">Chưa có bình luận nào. Hãy là người đầu tiên!</p>';
                return;
            }

            post.comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div>
                        <div class="comment-user">
                            @${c.user} ${c.user === post.author ? '<span style="color:#fe2c55; font-size:10px;">(Tác giả)</span>' : ''}
                            <span class="comment-time">${c.timestamp}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                `;
                commentList.appendChild(item);
            });

            commentList.scrollTop = commentList.scrollHeight;
        }

        function submitComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();

            if (!text || !activePostIdForComment) return;

            const post = posts.find(p => p.id === activePostIdForComment);
            if (!post) return;

            const newComment = {
                id: 'cm_' + Date.now(),
                user: currentUser,
                text: text,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            post.comments.push(newComment);
            saveToStorage();
            renderComments();
            renderFeed();

            client.publish(TOPIC_GLOBAL, JSON.stringify({
                type: 'ADD_COMMENT',
                postId: activePostIdForComment,
                comment: newComment
            }));

            input.value = '';
        }

        // MỞ VÀ ĐĂNG VIDEO CÁ NHÂN
        function openUploadModal() {
            document.getElementById('upload-modal').style.display = 'flex';
        }

        function closeUploadModal() {
            document.getElementById('upload-modal').style.display = 'none';
        }

        function uploadVideo() {
            const fileInput = document.getElementById('video-file-input');
            const captionInput = document.getElementById('video-caption-input');

            const file = fileInput.files[0];
            const caption = captionInput.value.trim();

            if (!file) {
                alert("Vui lòng chọn 1 tệp video!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newPost = {
                    id: 'post_' + Date.now(),
                    author: currentUser,
                    caption: caption || 'Video mới đăng!',
                    videoUrl: e.target.result,
                    likes: [],
                    comments: []
                };

                posts.unshift(newPost);
                saveAndRender();

                client.publish(TOPIC_GLOBAL, JSON.stringify({
                    type: 'NEW_POST',
                    post: newPost
                }));

                closeUploadModal();
                fileInput.value = '';
                captionInput.value = '';
            };

            reader.readAsDataURL(file);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
