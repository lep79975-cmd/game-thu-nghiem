<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Lounge - Smooth Sync & Mobile PC Style</title>

    <!-- Thư viện Three.js (3D Engine) & MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090714; color: #fff; touch-action: manipulation; }

        /* Canvas 3D chứa toàn màn hình */
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* GIAO DIỆN SẢNH (LOBBY OVERLAY) */
        #lobby-ui {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        .interactive { pointer-events: auto; }

        /* THANH CÔNG CỤ TẬP TRUNG TẠI SẢNH */
        .lobby-top-bar {
            display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;
            background: rgba(15, 23, 42, 0.9); padding: 10px 16px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.25); backdrop-filter: blur(12px);
            max-width: 95%; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .name-input {
            background: #0f172a; border: 1px solid #3b82f6; color: #fff; padding: 8px 14px;
            border-radius: 20px; outline: none; font-size: 13px; width: 140px; text-align: center; font-weight: bold;
        }

        .btn {
            background: #3b82f6; color: #fff; border: none; padding: 8px 14px; border-radius: 20px;
            font-weight: bold; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn:active, .btn:hover { transform: scale(1.05); filter: brightness(1.15); }
        .btn-green { background: #10b981; }
        .btn-purple { background: #8b5cf6; }
        .btn-orange { background: #f59e0b; }
        .btn-danger { background: #ef4444; }

        /* HUD TRONG GAME CỦA PHONG CÁCH PC */
        #game-hud {
            position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20; display: none;
            justify-content: space-between; align-items: center; pointer-events: none;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 12px; font-weight: bold; backdrop-filter: blur(8px);
        }

        /* KHUNG CHAT TRỰC TIẾP - Ở TRÊN CÙNG GÓC TRÁI */
        #chat-overlay {
            position: fixed; top: 52px; left: 10px; width: 280px; max-width: 75vw; z-index: 25; display: none;
            flex-direction: column; gap: 6px; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px; padding: 10px; backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #chat-messages { height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
        .msg-item { line-height: 1.3; word-break: break-word; }
        .msg-sender { font-weight: bold; color: #38bdf8; margin-right: 4px; }
        .msg-text { color: #f1f5f9; }
        .chat-input-row { display: flex; gap: 6px; }
        #chat-input { flex: 1; padding: 6px 10px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 12px; outline: none; }

        /* MODAL POPUP */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7);
            z-index: 100; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-card {
            background: #1e293b; border: 1px solid #475569; border-radius: 20px; padding: 20px;
            width: 90%; max-width: 440px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); color: #fff;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; }
        .close-btn { cursor: pointer; font-size: 18px; color: #94a3b8; } .close-btn:hover { color: #fff; }

        .server-list { background: #0f172a; border-radius: 10px; height: 160px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .server-item { background: #334155; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

        .color-picker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 6px; }
        .color-box { height: 36px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-box.selected { border-color: #fff; transform: scale(1.1); }

        /* ĐIỀU KHIỂN CẢM ỨNG MOBILE GIỐNG PC (UI DỄ NHÌN) */
        #mobile-controls {
            position: fixed; bottom: 20px; left: 0; right: 0; z-index: 30; display: none;
            justify-content: space-between; padding: 0 20px; pointer-events: none; align-items: flex-end;
        }
        .dpad-container { display: grid; grid-template-columns: repeat(3, 50px); gap: 6px; pointer-events: auto; }
        .touch-btn {
            width: 50px; height: 50px; background: rgba(15, 23, 42, 0.7); border: 1.5px solid rgba(255,255,255,0.4);
            border-radius: 14px; display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: bold; color: #fff; pointer-events: auto; backdrop-filter: blur(6px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .touch-btn:active { background: rgba(59, 130, 246, 0.8); transform: scale(0.92); }
        .jump-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(16, 185, 129, 0.85); border: 2px solid #fff; font-size: 14px; }

        @media (hover: hover) and (pointer: fine) { #mobile-controls { display: none !important; } }
    </style>
</head>
<body>

    <!-- CANVAS ENGINE 3D -->
    <div id="webgl-container"></div>

    <!-- UI SẢNH LOBBY -->
    <div id="lobby-ui">
        <div class="lobby-top-bar interactive">
            <input type="text" id="player-name-input" class="name-input" value="Bóng Roblox" maxlength="12" placeholder="Tên nhân vật...">
            <button class="btn btn-purple" onclick="openAvatarModal()">🎨 Đổi Màu</button>
            <button class="btn btn-green" onclick="quickMatch()">⚡ Tìm Nhanh</button>
            <button class="btn btn-orange" onclick="toggleCameraMode()" id="cam-toggle-btn">📷 Cam: 2D Top-Down</button>
            <button class="btn btn-blue" style="background:#0284c7;" onclick="openServerModal()">🌐 Danh Sách</button>
        </div>

        <div style="text-align: center; color: rgba(255,255,255,0.8); font-size: 12px; text-shadow: 0 2px 4px #000;">
            💡 <b>Di chuyển:</b> Dùng <b>WASD</b> / Nút cảm ứng Mobile. ⚡ Bấm <b>Tìm Nhanh</b> để vào game ngay!
        </div>
    </div>

    <!-- HUD TRONG GAME CỦA PHONG CÁCH PC -->
    <div id="game-hud">
        <div class="hud-card" id="hud-room-info">Server: Sân Bóng Đá</div>
        <div class="hud-card" id="hud-online-count">👥 1 Trực tuyến</div>
        <button class="btn btn-danger interactive" onclick="leaveServer()">Thoát</button>
    </div>

    <!-- KHUNG CHAT TRỰC TIẾP - Ở TRÊN CÙNG GÓC TRÁI -->
    <div id="chat-overlay" class="interactive">
        <div id="chat-messages">
            <div style="color: #94a3b8; font-style: italic;">Chat trên cùng góc trái. Nhập tin nhắn bên dưới!</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." maxlength="50">
            <button class="btn btn-purple" onclick="sendChat()">Gửi</button>
        </div>
    </div>

    <!-- ĐIỀU KHIỂN CẢM ỨNG MOBILE GIỐNG PC -->
    <div id="mobile-controls">
        <div class="dpad-container">
            <div></div><div class="touch-btn" id="btn-up">▲</div><div></div>
            <div class="touch-btn" id="btn-left">◄</div><div class="touch-btn" id="btn-down">▼</div><div class="touch-btn" id="btn-right">►</div>
        </div>
        <div class="touch-btn jump-btn" id="btn-jump">NHẢY</div>
    </div>

    <!-- MODAL SERVER -->
    <div class="modal interactive" id="server-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span>🌐 Danh Sách Server Online</span>
                <span class="close-btn" onclick="closeServerModal()">✖</span>
            </div>
            
            <div style="display:flex; gap: 8px;">
                <input type="text" id="new-servername-input" class="name-input" style="flex:1; text-align:left;" placeholder="Tên Server mới..." maxlength="15">
                <button class="btn btn-green" onclick="createNewServer()">🚀 Tạo Phòng</button>
            </div>

            <div class="server-list" id="server-list-box">
                <div style="text-align:center; color:#64748b; margin-top:50px; font-size:12px;">Đang tìm phòng...</div>
            </div>
        </div>
    </div>

    <!-- MODAL AVATAR -->
    <div class="modal interactive" id="avatar-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span>🎨 Tùy Chỉnh Màu Bóng</span>
                <span class="close-btn" onclick="closeAvatarModal()">✖</span>
            </div>
            <div class="color-picker-grid" id="color-picker"></div>
            <button class="btn btn-purple" style="margin-top:10px; justify-content:center;" onclick="closeAvatarModal()">Xác Nhận</button>
        </div>
    </div>

<script>
    /* --- CẤU HÌNH MQTT MULTIPLAYER --- */
    const LOBBY_TOPIC = "cozy-lounge-v5/3d-lobby";
    const myClientId = 'user_3d_' + Math.random().toString(36).substr(2, 6);
    let myColor = '#3b82f6';
    let myName = "Bóng Roblox";
    let currentRoomId = null;
    let isHost = false;

    const availableColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#ffffff', '#1e293b'];

    /* --- THREE.JS 3D ENGINE --- */
    let scene, camera, renderer;
    let myBallGroup, otherPlayers = {}, publicServers = {};
    
    // Góc xoay Camera
    let cameraAngleYaw = 0;
    let cameraAnglePitch = 1.1; 
    let is2DTopDownMode = true;

    // Vật lý nhân vật
    let pos = { x: 0, y: 1, z: 0 };
    let velocityY = 0;
    let isGrounded = true;
    const gravity = 28, jumpPower = 12, speed = 14;

    let keys = { w: false, a: false, s: false, d: false, space: false };
    let lastBroadcastTime = 0;

    function init3D() {
        const container = document.getElementById('webgl-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.012);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Tạo sân bóng
        createFootballPitch();

        // Tạo nhân vật bản thân
        myBallGroup = create3DBallMesh(myColor, myName);
        scene.add(myBallGroup);

        window.addEventListener('resize', onWindowResize);
        setupInteraction();
    }

    /* --- SÂN BÓNG ĐÁ 3D HỌA TIẾT KẺ Ô 2D --- */
    function createFootballPitch() {
        const fieldGeo = new THREE.PlaneGeometry(80, 120);
        const fieldMat = new THREE.MeshStandardMaterial({ color: 0x2ed573, roughness: 0.5 });
        const field = new THREE.Mesh(fieldGeo, fieldMat);
        field.rotation.x = -Math.PI / 2;
        field.receiveShadow = true;
        scene.add(field);

        const groundGeo = new THREE.PlaneGeometry(250, 250);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        scene.add(ground);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const centerCircleGeo = new THREE.RingGeometry(9.8, 10, 32);
        const centerCircle = new THREE.Mesh(centerCircleGeo, lineMat);
        centerCircle.rotation.x = -Math.PI / 2;
        centerCircle.position.y = 0.01;
        scene.add(centerCircle);

        createGoalPost(0, 58, Math.PI);
        createGoalPost(0, -58, 0);
    }

    function createGoalPost(x, z, rot) {
        const goalGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5), postMat); p1.position.set(-6, 2.5, 0);
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5), postMat); p2.position.set(6, 2.5, 0);
        const top = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 12.4), postMat); top.rotation.z = Math.PI / 2; top.position.set(0, 5, 0);
        goalGroup.add(p1, p2, top);
        goalGroup.position.set(x, 0, z);
        goalGroup.rotation.y = rot;
        scene.add(goalGroup);
    }

    /* --- MÔ HÌNH NHÂN VẬT 3D --- */
    function create3DBallMesh(colorHex, labelText) {
        const group = new THREE.Group();

        const ballGeo = new THREE.SphereGeometry(1, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorHex), roughness: 0.3, metalness: 0.1 });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);
        ballMesh.castShadow = true;
        group.add(ballMesh);

        const eyeGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(0.35, 0.2, 0.85);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(-0.35, 0.2, 0.85);

        const mouthGeo = new THREE.TorusGeometry(0.18, 0.04, 8, 16, Math.PI);
        const mouthMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat); mouth.position.set(0, -0.15, 0.9); mouth.rotation.x = Math.PI;

        group.add(leftEye, rightEye, mouth);

        const nameSprite = createTextSprite(labelText);
        nameSprite.position.set(0, 1.8, 0);
        group.add(nameSprite);

        return group;
    }

    function createTextSprite(text) {
        const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.roundRect(10, 10, 236, 44, 20); ctx.fill();
        ctx.font = 'Bold 22px sans-serif'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
        ctx.fillText(text, 128, 40);

        const texture = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
        sprite.scale.set(3, 0.75, 1);
        return sprite;
    }

    /* --- ĐIỀU KHIỂN & CƠ CHẾ DI CHUYỂN --- */
    function setupInteraction() {
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
            if (e.code === 'Space') {
                keys.space = true;
                if (isGrounded) { velocityY = jumpPower; isGrounded = false; }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // Xoay Camera khi kéo chuột
        let isMouseDown = false, prevMouseX = 0, prevMouseY = 0;
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.interactive')) return;
            isMouseDown = true; prevMouseX = e.clientX; prevMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaX = e.clientX - prevMouseX;
            const deltaY = e.clientY - prevMouseY;
            cameraAngleYaw -= deltaX * 0.005;
            cameraAnglePitch += deltaY * 0.005;
            cameraAnglePitch = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraAnglePitch));
            prevMouseX = e.clientX; prevMouseY = e.clientY;
        });

        // Gắn nút cảm ứng Mobile
        bindTouch('btn-up', 'w'); bindTouch('btn-down', 's');
        bindTouch('btn-left', 'a'); bindTouch('btn-right', 'd');
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = jumpPower; isGrounded = false; }
        });
    }

    function bindTouch(btnId, keyName) {
        const el = document.getElementById(btnId);
        if(!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    }

    function updatePhysics(delta) {
        let moveX = 0, moveZ = 0;
        if (keys.w) moveZ -= 1;
        if (keys.s) moveZ += 1;
        if (keys.a) moveX -= 1;
        if (keys.d) moveX += 1;

        if (moveX !== 0 || moveZ !== 0) {
            const length = Math.hypot(moveX, moveZ);
            moveX /= length; moveZ /= length;

            const worldMoveX = moveX * Math.cos(cameraAngleYaw) + moveZ * Math.sin(cameraAngleYaw);
            const worldMoveZ = -moveX * Math.sin(cameraAngleYaw) + moveZ * Math.cos(cameraAngleYaw);

            pos.x += worldMoveX * speed * delta;
            pos.z += worldMoveZ * speed * delta;

            const targetRotation = Math.atan2(worldMoveX, worldMoveZ);
            myBallGroup.rotation.y = targetRotation;
        }

        // Trọng lực
        velocityY -= gravity * delta;
        pos.y += velocityY * delta;

        if (pos.y <= 1) {
            pos.y = 1; velocityY = 0; isGrounded = true;
        }

        myBallGroup.position.set(pos.x, pos.y, pos.z);

        // Bám đuổi Camera
        const camDistance = is2DTopDownMode ? 22 : 14;
        camera.position.x = pos.x + camDistance * Math.sin(cameraAngleYaw) * Math.cos(cameraAnglePitch);
        camera.position.y = pos.y + camDistance * Math.sin(cameraAnglePitch);
        camera.position.z = pos.z + camDistance * Math.cos(cameraAngleYaw) * Math.cos(cameraAnglePitch);
        camera.lookAt(pos.x, pos.y + 0.5, pos.z);

        // MƯỢT HÓA DỮ LIỆU CỦA NGƯỜI CHƠI KHÁC (SMOOTH INTERPOLATION / LERP)
        for (let id in otherPlayers) {
            let pMesh = otherPlayers[id];
            if (pMesh.targetPos) {
                pMesh.position.x += (pMesh.targetPos.x - pMesh.position.x) * 0.25;
                pMesh.position.y += (pMesh.targetPos.y - pMesh.position.y) * 0.25;
                pMesh.position.z += (pMesh.targetPos.z - pMesh.position.z) * 0.25;
                pMesh.rotation.y += (pMesh.targetRotY - pMesh.rotation.y) * 0.25;
            }
        }
    }

    /* --- GAME LOOP --- */
    let lastTime = performance.now();
    function gameLoop(now) {
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        updatePhysics(delta);
        broadcastPosition();

        renderer.render(scene, camera);
        requestAnimationFrame(gameLoop);
    }

    /* --- WEBSOCKET MQTT CHAT & MULTIPLAYER --- */
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: myClientId });

    client.on('connect', () => { client.subscribe(LOBBY_TOPIC); });

    client.on('message', (topic, message) => {
        try {
            const data = JSON.parse(message.toString());

            if (topic === LOBBY_TOPIC && data.type === 'SERVER_PING') {
                publicServers[data.roomId] = { ...data, lastPing: Date.now() };
                renderServerList();
                return;
            }

            if (topic === `cozy-lounge-v5/room/${currentRoomId}`) {
                if (data.sender === myClientId) return;

                if (data.type === 'MOVE') {
                    if (!otherPlayers[data.sender]) {
                        const pMesh = create3DBallMesh(data.color, data.name);
                        pMesh.targetPos = { x: data.x, y: data.y, z: data.z };
                        pMesh.targetRotY = data.rotY;
                        pMesh.position.set(data.x, data.y, data.z);
                        otherPlayers[data.sender] = pMesh;
                        scene.add(pMesh);
                        updateOnlineCount();
                    } else {
                        let pMesh = otherPlayers[data.sender];
                        pMesh.targetPos = { x: data.x, y: data.y, z: data.z };
                        pMesh.targetRotY = data.rotY;
                    }
                }
                else if (data.type === 'CHAT') {
                    appendChatMessage(data.name, data.text);
                }
                else if (data.type === 'LEAVE') {
                    if (otherPlayers[data.sender]) {
                        scene.remove(otherPlayers[data.sender]);
                        delete otherPlayers[data.sender];
                        updateOnlineCount();
                    }
                }
            }
        } catch(e){}
    });

    /* DI CHUYỂN AUTO CHUẨN 0.1S (100MS) METRONOME */
    function broadcastPosition() {
        const now = Date.now();
        if (now - lastBroadcastTime < 100) return; // Đúng 0.1s tự gửi 1 lần
        lastBroadcastTime = now;

        if (client && client.connected && currentRoomId) {
            client.publish(`cozy-lounge-v5/room/${currentRoomId}`, JSON.stringify({
                type: 'MOVE', sender: myClientId, name: myName, color: myColor,
                x: pos.x, y: pos.y, z: pos.z, rotY: myBallGroup.rotation.y
            }));
        }
    }

    /* --- TÌM SERVER NHANH HƠN (QUICK MATCHMAKING) --- */
    function quickMatch() {
        const now = Date.now();
        let foundRoom = null;

        for (let id in publicServers) {
            if (now - publicServers[id].lastPing < 5000) {
                foundRoom = publicServers[id];
                break;
            }
        }

        if (foundRoom) {
            joinServer(foundRoom.roomId, foundRoom.roomName);
        } else {
            // Tự tạo nhanh phòng nếu chưa có phòng nào
            const autoRoomName = "Sân Bóng #" + Math.floor(100 + Math.random() * 900);
            document.getElementById('new-servername-input').value = autoRoomName;
            createNewServer();
        }
    }

    /* --- HỆ THỐNG CHAT 2D --- */
    function sendChat() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        appendChatMessage(myName, text, true);

        if (client && client.connected && currentRoomId) {
            client.publish(`cozy-lounge-v5/room/${currentRoomId}`, JSON.stringify({
                type: 'CHAT', sender: myClientId, name: myName, text: text
            }));
        }
        input.value = '';
    }

    function appendChatMessage(sender, text, isMe = false) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'msg-item';
        div.innerHTML = `<span class="msg-sender" style="color:${isMe ? '#f59e0b':'#38bdf8'}">${escapeHtml(sender)}:</span><span class="msg-text">${escapeHtml(text)}</span>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('chat-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendChat();
        e.stopPropagation();
    });

    /* --- CHỨC NĂNG GIAO DIỆN SẢNH --- */
    function toggleCameraMode() {
        is2DTopDownMode = !is2DTopDownMode;
        if (is2DTopDownMode) {
            cameraAnglePitch = 1.1;
            document.getElementById('cam-toggle-btn').innerText = "📷 Cam: 2D Top-Down";
        } else {
            cameraAnglePitch = 0.3;
            document.getElementById('cam-toggle-btn').innerText = "📷 Cam: 3D Tự Do";
        }
    }

    function openAvatarModal() {
        const picker = document.getElementById('color-picker');
        picker.innerHTML = '';
        availableColors.forEach(c => {
            const box = document.createElement('div');
            box.className = `color-box ${c === myColor ? 'selected':''}`;
            box.style.background = c;
            box.onclick = () => {
                myColor = c;
                scene.remove(myBallGroup);
                myBallGroup = create3DBallMesh(myColor, myName);
                scene.add(myBallGroup);
                openAvatarModal();
            };
            picker.appendChild(box);
        });
        document.getElementById('avatar-modal').style.display = 'flex';
    }
    function closeAvatarModal() { document.getElementById('avatar-modal').style.display = 'none'; }

    function openServerModal() { document.getElementById('server-modal').style.display = 'flex'; }
    function closeServerModal() { document.getElementById('server-modal').style.display = 'none'; }

    function renderServerList() {
        const listEl = document.getElementById('server-list-box');
        const now = Date.now();
        let html = '', count = 0;

        for (let id in publicServers) {
            let s = publicServers[id];
            if (now - s.lastPing < 5000) {
                count++;
                html += `
                    <div class="server-item">
                        <div>
                            <b>${escapeHtml(s.roomName)}</b>
                            <div style="font-size:10px; color:#94a3b8;">Host: ${escapeHtml(s.hostName)}</div>
                        </div>
                        <button class="btn btn-purple" onclick="joinServer('${s.roomId}', '${escapeHtml(s.roomName)}')">Vào</button>
                    </div>
                `;
            }
        }
        if (count === 0) listEl.innerHTML = `<div style="text-align:center; color:#64748b; margin-top:50px; font-size:12px;">Chưa có Server. Hãy bấm <b>Tìm Nhanh</b> để tự động tạo!</div>`;
        else listEl.innerHTML = html;
    }

    function createNewServer() {
        const sName = document.getElementById('new-servername-input').value.trim() || ("Sân Bóng #" + Math.floor(100 + Math.random() * 900));

        currentRoomId = 'ROOM_' + Math.floor(1000 + Math.random() * 9000);
        isHost = true;
        enterGameRoom(sName);

        // Ping phòng mỗi 1s cho các máy khác thấy nhanh hơn
        setInterval(() => {
            if (isHost && client && client.connected) {
                client.publish(LOBBY_TOPIC, JSON.stringify({
                    type: 'SERVER_PING', roomId: currentRoomId, roomName: sName, hostName: myName
                }));
            }
        }, 1000);
    }

    function joinServer(roomId, roomName) {
        currentRoomId = roomId;
        isHost = false;
        enterGameRoom(roomName);
    }

    function enterGameRoom(roomName) {
        closeServerModal();
        myName = document.getElementById('player-name-input').value.trim() || "Bóng Roblox";
        
        scene.remove(myBallGroup);
        myBallGroup = create3DBallMesh(myColor, myName);
        scene.add(myBallGroup);

        document.getElementById('lobby-ui').style.display = 'none';
        document.getElementById('game-hud').style.display = 'flex';
        document.getElementById('chat-overlay').style.display = 'flex';
        document.getElementById('hud-room-info').innerText = `Server: ${roomName}`;
        
        if (isMobile()) document.getElementById('mobile-controls').style.display = 'flex';

        client.subscribe(`cozy-lounge-v5/room/${currentRoomId}`);
    }

    function leaveServer() {
        if (client && currentRoomId) {
            client.publish(`cozy-lounge-v5/room/${currentRoomId}`, JSON.stringify({
                type: 'LEAVE', sender: myClientId
            }));
        }
        location.reload();
    }

    function updateOnlineCount() {
        let count = Object.keys(otherPlayers).length + 1;
        document.getElementById('hud-online-count').innerText = `👥 ${count} Trực tuyến`;
    }

    function isMobile() { return /Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768; }
    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // CHẠY GAME
    init3D();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
