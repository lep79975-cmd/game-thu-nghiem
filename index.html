<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Online Chat Room</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --sidebar-bg: #12121a;
            --card-bg: #252536;
            --accent-color: #7289da;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* SIDEBAR */
        #sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .user-panel {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: #43b581;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn-danger { background: #f04747; }
        .btn-primary { background: #7289da; }

        .room-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room-item {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:hover { background: #32324a; }

        /* MAIN CHAT AREA */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            background: var(--sidebar-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* MESSAGE BUBBLES */
        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
            user-select: none;
            cursor: pointer;
        }

        .message.me {
            align-self: flex-end;
            background-color: #0084ff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            align-self: flex-start;
            background-color: var(--card-bg);
            color: white;
            border-bottom-left-radius: 2px;
        }

        .msg-author {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 4px;
            display: block;
        }

        .typing-status {
            font-style: italic;
            color: #aaa;
            font-size: 0.9rem;
            height: 20px;
            padding-left: 20px;
        }

        /* NEON LINK STYLING */
        a.neon-link {
            color: #00f3ff;
            text-decoration: underline;
            text-shadow: 0 0 5px #00f3ff, 0 0 10px #00f3ff;
            font-weight: bold;
        }

        /* CHAT INPUT AREA */
        .chat-input-area {
            padding: 15px;
            background: var(--sidebar-bg);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: white;
            outline: none;
        }

        .chat-media-preview img, .chat-media-preview video {
            max-width: 250px;
            border-radius: 8px;
            margin-top: 5px;
        }

        /* POLL / DECISION BOX */
        .poll-box {
            background: #2f3136;
            border: 1px solid #7289da;
            border-radius: 8px;
            padding: 12px;
            margin-top: 5px;
            width: 100%;
        }

        .poll-option {
            background: #40444b;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .poll-option:hover { background: #575c66; }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-content input {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: white;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h3>Game Chat Hub</h3>
        <div class="user-panel">
            <span id="display-username">Đang tải...</span>
            <button class="btn btn-primary" onclick="changeName()" style="font-size:11px">Đổi tên</button>
        </div>

        <button class="btn" onclick="createRoom()">+ Tạo Phòng Mới</button>

        <div style="margin-top: 10px;">
            <label style="font-size: 12px;">Đổi màu nền Web:</label>
            <input type="color" id="bg-picker" onchange="changeBgColor(this.value)" value="#1a1a24" style="width: 100%; cursor: pointer;">
        </div>

        <h4>Tất cả phòng Online</h4>
        <div class="room-list" id="room-list">
            <!-- Danh sách phòng hiển thị ở đây -->
        </div>
    </div>

    <!-- MAIN CHAT -->
    <div id="chat-container">
        <div class="chat-header">
            <div>
                <h3 id="room-title">Chưa vào phòng nào</h3>
                <small id="room-subtitle"></small>
            </div>
            <div id="host-controls" style="display: none; gap: 8px;">
                <button class="btn btn-primary" onclick="openPollModal()">+ Bảng Quyết Định</button>
                <button class="btn btn-danger" onclick="openRoomInfo()">Thông tin phòng</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Tin nhắn hiển thị ở đây -->
        </div>

        <div class="typing-status" id="typing-status"></div>

        <div class="chat-input-area">
            <input type="file" id="media-input" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
            <button class="btn btn-primary" onclick="document.getElementById('media-input').click()">📁 Media</button>
            <input type="text" id="message-input" placeholder="Nhập tin nhắn..." oninput="handleTyping()">
            <button class="btn" onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <!-- MODAL TẠO BẢNG QUYẾT ĐỊNH -->
    <div class="modal" id="poll-modal">
        <div class="modal-content">
            <h3>Tạo Bảng Quyết Định</h3>
            <input type="text" id="poll-question" placeholder="Ghi câu hỏi ở đây">
            <div id="poll-answers-container">
                <input type="text" class="poll-answer-input" placeholder="Ghi câu trả lời ở đây">
                <input type="text" class="poll-answer-input" placeholder="Ghi câu trả lời ở đây">
            </div>
            <button class="btn btn-primary" onclick="addPollOption()">Thêm câu trả lời +</button>
            <button class="btn" onclick="sendPoll()">Đăng Bảng Quyết Định</button>
            <button class="btn btn-danger" onclick="closeModal('poll-modal')">Hủy</button>
        </div>
    </div>

    <!-- MODAL THÔNG TIN PHÒNG & KICK -->
    <div class="modal" id="info-modal">
        <div class="modal-content">
            <h3>Thông tin phòng</h3>
            <div id="info-details"></div>
            <h4>Thành viên (Chủ phòng có quyền Kick):</h4>
            <div id="member-list"></div>
            <button class="btn btn-danger" onclick="closeModal('info-modal')">Đóng</button>
        </div>
    </div>

    <script>
        // TRẠNG THÁI DỮ LIỆU
        let currentUser = localStorage.getItem('chat_username') || '';
        let currentRoomId = null;
        let isOwner = false;
        let selectedMedia = null;
        let typingTimeout = null;

        // Tên phòng & Channel đa tab (BroadCast API cho phép các tab thông nhau như máy chủ)
        const channel = new BroadcastChannel('game_online_chat');

        // BẮT ĐẦU ỨNG DỤNG
        window.onload = () => {
            if (!currentUser) {
                changeName();
            } else {
                document.getElementById('display-username').innerText = currentUser;
            }
            loadRooms();
            applySavedBg();
        };

        function changeName() {
            let name = prompt("Nhập tên hiển thị của bạn trong game:", currentUser);
            if (name && name.trim() !== '') {
                currentUser = name.trim();
                localStorage.setItem('chat_username', currentUser);
                document.getElementById('display-username').innerText = currentUser;
            }
        }

        // TỰ ĐỘNG PHÁT HIỆN GÕ PHÍM HAM "..."
        function handleTyping() {
            const input = document.getElementById('message-input');
            if (input.value.length > 0 && currentRoomId) {
                channel.postMessage({
                    type: 'TYPING',
                    roomId: currentRoomId,
                    user: currentUser,
                    isTyping: true
                });

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    channel.postMessage({
                        type: 'TYPING',
                        roomId: currentRoomId,
                        user: currentUser,
                        isTyping: false
                    });
                }, 1500);
            }
        }

        // ĐỔI MÀU NỀN
        function changeBgColor(color) {
            document.body.style.backgroundColor = color;
            localStorage.setItem('chat_bg_color', color);
        }

        function applySavedBg() {
            const color = localStorage.getItem('chat_bg_color');
            if (color) {
                document.body.style.backgroundColor = color;
                document.getElementById('bg-picker').value = color;
            }
        }

        // QUẢN LÝ PHÒNG
        function getRooms() {
            return JSON.parse(localStorage.getItem('game_rooms') || '[]');
        }

        function saveRooms(rooms) {
            localStorage.setItem('game_rooms', JSON.stringify(rooms));
            channel.postMessage({ type: 'ROOMS_UPDATED' });
            loadRooms();
        }

        function createRoom() {
            const roomName = prompt("Nhập tên phòng muốn tạo:");
            if (!roomName) return;

            const rooms = getRooms();
            const newRoom = {
                id: 'room_' + Date.now(),
                name: roomName,
                host: currentUser,
                createdAt: new Date().toLocaleString(),
                messages: [],
                members: [currentUser]
            };

            rooms.push(newRoom);
            saveRooms(rooms);
            joinRoom(newRoom.id);
        }

        function loadRooms() {
            const rooms = getRooms();
            const roomListEl = document.getElementById('room-list');
            roomListEl.innerHTML = '';

            rooms.forEach(room => {
                const item = document.createElement('div');
                item.className = 'room-item';
                item.innerHTML = `
                    <div>
                        <strong>${room.name}</strong><br>
                        <small style="color:#aaa">Chủ: ${room.host}</small>
                    </div>
                `;
                item.onclick = () => joinRoom(room.id);
                roomListEl.appendChild(item);
            });
        }

        function joinRoom(roomId) {
            const rooms = getRooms();
            const room = rooms.find(r => r.id === roomId);
            if (!room) return;

            currentRoomId = roomId;
            isOwner = room.host === currentUser;

            // Thêm vào danh sách thành viên nếu chưa có
            if (!room.members.includes(currentUser)) {
                room.members.push(currentUser);
                saveRooms(rooms);
            }

            document.getElementById('room-title').innerText = room.name;
            document.getElementById('room-subtitle').innerText = `Chủ phòng: ${room.host}`;
            document.getElementById('host-controls').style.display = isOwner ? 'flex' : 'none';

            renderMessages();
        }

        // XỬ LÝ GỬI TIN NHẮN & MEDIA
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedMedia = {
                    type: file.type.startsWith('image/') ? 'image' : 'video',
                    url: evt.target.result
                };
                sendMessage(); // Gửi luôn khi chọn xong media
            };
            reader.readAsDataURL(file);
        }

        function formatMessageText(text) {
            // Regex biến URL thành Link Neon
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a class="neon-link" href="${url}" target="_blank">${url}</a>`;
            });
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text && !selectedMedia) return;
            if (!currentRoomId) {
                alert("Vui lòng chọn hoặc tạo phòng trước!");
                return;
            }

            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);

            const newMessage = {
                id: 'msg_' + Date.now(),
                sender: currentUser,
                text: text,
                media: selectedMedia,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            room.messages.push(newMessage);
            saveRooms(rooms);

            input.value = '';
            selectedMedia = null;
            document.getElementById('media-input').value = '';
            
            // Tắt dấu "..." khi đã gửi
            channel.postMessage({ type: 'TYPING', roomId: currentRoomId, user: currentUser, isTyping: false });
            renderMessages();
        }

        // HIỂN THỊ TIN NHẮN (Bên phải nếu là mình, bên trái nếu là người khác)
        function renderMessages() {
            if (!currentRoomId) return;
            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';

            room.messages.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isMe ? 'me' : 'other'}`;

                let contentHtml = `<span class="msg-author">${msg.sender} [${msg.timestamp}]</span>`;
                
                if (msg.text) {
                    contentHtml += `<div>${formatMessageText(msg.text)}</div>`;
                }

                if (msg.media) {
                    if (msg.media.type === 'image') {
                        contentHtml += `<div class="chat-media-preview"><img src="${msg.media.url}"></div>`;
                    } else if (msg.media.type === 'video') {
                        contentHtml += `<div class="chat-media-preview"><video src="${msg.media.url}" controls></video></div>`;
                    }
                }

                if (msg.poll) {
                    contentHtml += `
                        <div class="poll-box">
                            <strong>📊 ${msg.poll.question}</strong>
                            ${msg.poll.options.map((opt, idx) => `
                                <div class="poll-option" onclick="votePoll('${msg.id}', ${idx})">
                                    ${opt.text} (${opt.votes ? opt.votes.length : 0})
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                msgEl.innerHTML = contentHtml;

                // GIỮ TAY LÊN TIN NHẮN ĐỂ XÓA (Long Press)
                let pressTimer;
                msgEl.addEventListener('mousedown', () => {
                    pressTimer = window.setTimeout(() => {
                        if (confirm("Bạn có muốn xóa tin nhắn này không?")) {
                            deleteMessage(msg.id);
                        }
                    }, 800); // Giữ 0.8s để xóa
                });
                msgEl.addEventListener('mouseup', () => clearTimeout(pressTimer));
                msgEl.addEventListener('mouseleave', () => clearTimeout(pressTimer));

                chatBox.appendChild(msgEl);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function deleteMessage(msgId) {
            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);
            room.messages = room.messages.filter(m => m.id !== msgId);
            saveRooms(rooms);
            renderMessages();
        }

        // BẢNG QUYẾT ĐỊNH (POLL)
        function openPollModal() { document.getElementById('poll-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addPollOption() {
            const container = document.getElementById('poll-answers-container');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'poll-answer-input';
            input.placeholder = 'Ghi câu trả lời ở đây';
            container.appendChild(input);
        }

        function sendPoll() {
            const q = document.getElementById('poll-question').value.trim();
            const optionInputs = document.querySelectorAll('.poll-answer-input');
            const options = [];

            optionInputs.forEach(input => {
                if (input.value.trim()) {
                    options.push({ text: input.value.trim(), votes: [] });
                }
            });

            if (!q || options.length < 2) {
                alert("Vui lòng nhập câu hỏi và ít nhất 2 câu trả lời!");
                return;
            }

            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);
            room.messages.push({
                id: 'msg_' + Date.now(),
                sender: currentUser,
                poll: { question: q, options: options },
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });

            saveRooms(rooms);
            closeModal('poll-modal');
            renderMessages();
        }

        function votePoll(msgId, optionIndex) {
            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);
            const msg = room.messages.find(m => m.id === msgId);
            if (!msg || !msg.poll) return;

            // Xóa vote cũ
            msg.poll.options.forEach(opt => {
                opt.votes = (opt.votes || []).filter(u => u !== currentUser);
            });

            // Thêm vote mới
            msg.poll.options[optionIndex].votes.push(currentUser);
            saveRooms(rooms);
            renderMessages();
        }

        // THÔNG TIN PHÒNG & KICK
        function openRoomInfo() {
            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);

            document.getElementById('info-details').innerHTML = `
                <p><strong>Ngày tạo:</strong> ${room.createdAt}</p>
                <p><strong>Tổng số chat:</strong> ${room.messages.length}</p>
            `;

            const memberList = document.getElementById('member-list');
            memberList.innerHTML = '';
            room.members.forEach(m => {
                const div = document.createElement('div');
                div.style.display = 'flex';
                div.style.justifySpaceBetween = 'space-between';
                div.style.marginTop = '5px';
                div.innerHTML = `<span>${m}</span>`;
                
                if (isOwner && m !== currentUser) {
                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'btn btn-danger';
                    kickBtn.innerText = 'Kick';
                    kickBtn.style.padding = '2px 8px';
                    kickBtn.onclick = () => kickMember(m);
                    div.appendChild(kickBtn);
                }
                memberList.appendChild(div);
            });

            document.getElementById('info-modal').style.display = 'flex';
        }

        function kickMember(member) {
            const rooms = getRooms();
            const room = rooms.find(r => r.id === currentRoomId);
            room.members = room.members.filter(m => m !== member);
            saveRooms(rooms);
            openRoomInfo();
        }

        // LẮNG NGHE ĐA TAB / LỚP TRUYỀN DỮ LIỆU SỰ KIỆN (REALTIME)
        channel.onmessage = (event) => {
            const data = event.data;
            if (data.type === 'ROOMS_UPDATED') {
                loadRooms();
                if (currentRoomId) renderMessages();
            } else if (data.type === 'TYPING' && data.roomId === currentRoomId && data.user !== currentUser) {
                const statusEl = document.getElementById('typing-status');
                statusEl.innerText = data.isTyping ? `${data.user} đang nhắn ...` : '';
            }
        };
    </script>
</body>
</html>
